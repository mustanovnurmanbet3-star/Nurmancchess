<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0e10">
<title>Nurman chess</title>
<style>
:root{--gold:#dcb65e;--gold2:#a8802f;--ink:#f7ece0;--mut:#cdb79f;--panel:rgba(26,9,10,.72);--line:rgba(220,182,94,.28);--wp:8px;--fp:clamp(6px,1.8vw,14px);
--bs:min(calc(100vw - 2*var(--wp) - 2*var(--fp)),600px,max(280px,calc(100vh - 250px)))}
@supports (height:100dvh){:root{--bs:min(calc(100vw - 2*var(--wp) - 2*var(--fp)),600px,max(280px,calc(100dvh - 250px)))}}
*{box-sizing:border-box}
html{background:#190708;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
 background:radial-gradient(ellipse 120% 70% at 50% -10%,#6a2020 0%,#34120f 45%,#190708 100%) fixed;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72' fill='none' stroke='%23dcb65e' stroke-opacity='.13' stroke-width='1'><path d='M36 4 68 36 36 68 4 36Z'/><path d='M36 16 56 36 36 56 16 36Z'/><circle cx='36' cy='36' r='4'/><circle cx='0' cy='0' r='3'/><circle cx='72' cy='0' r='3'/><circle cx='0' cy='72' r='3'/><circle cx='72' cy='72' r='3'/></svg>")}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:active{opacity:.75}
.screen{position:relative;z-index:1}
.gold-t{font-family:Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#fff0c4,#dcb65e 55%,#a8802f);-webkit-background-clip:text;background-clip:text;color:transparent}

/* HOME */
.home{max-width:520px;margin:0 auto;padding:18px 14px 28px;display:flex;flex-direction:column;align-items:center}
.hbar{width:100%;display:flex;justify-content:flex-end}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#4a1a16,#2a0e0d);font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.logo{width:112px;height:112px;border-radius:50%;margin-top:2px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#7a2a22,#3a110e 70%);border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 40px rgba(220,182,94,.35),inset 0 0 18px rgba(0,0,0,.5)}
.logo img{width:78%;height:78%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.brand{font-size:40px;font-weight:800;margin:14px 0 2px;letter-spacing:.5px;text-align:center}
.tag{color:var(--mut);margin:0 0 18px;font-size:15px;text-align:center}
.panel{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.ph{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:2px 0 10px;font-weight:700}
.cat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 0;border-top:1px solid rgba(220,182,94,.14)}
.cat:first-of-type{border-top:0}
.ci{width:30px;font-size:22px;text-align:center;flex:none}
.cn{flex:1;font-weight:700;font-size:16px}
.chips{display:flex;gap:8px;flex:0 0 100%}
.chip{flex:0 1 calc(33.333% - 6px);min-width:0;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip.on{background:linear-gradient(180deg,#f3d789,#c79a3e);color:#2a1206;border-color:#fff1c2;box-shadow:0 0 14px rgba(220,182,94,.45)}
.sel{margin:16px 0 8px;font-size:15px;color:var(--mut);text-align:center}
.sel b{color:var(--ink)}
.play{width:100%;padding:16px;border-radius:14px;border:1px solid #fff1c2;font-size:21px;font-weight:800;color:#2a1206;background:linear-gradient(180deg,#f6dc92,#cc9f40 60%,#b98a30);box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 24px rgba(220,182,94,.3);letter-spacing:.5px}
.note{margin:12px 0 0;font-size:12.5px;color:var(--mut);text-align:center}

.seg{width:100%;display:flex;gap:6px;padding:5px;margin-bottom:12px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.segb{flex:1;padding:11px 6px;border-radius:10px;border:0;background:transparent;font-weight:700;font-size:15px;color:var(--mut)}
.segb.on{background:linear-gradient(180deg,#f6dc92,#cc9f40);color:#2a1206;box-shadow:0 0 14px rgba(220,182,94,.4)}
/* GAME */
.stage{width:calc(var(--bs) + 2*var(--fp));max-width:100%;margin:0 auto;padding:8px 0 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gtitle{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;min-width:0;white-space:nowrap}
.gtitle img{width:24px;height:24px}
.pill{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--gold);-webkit-text-fill-color:var(--gold);white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:6px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:box-shadow .2s,border-color .2s}
.bar.act{border-color:var(--gold);box-shadow:0 0 16px rgba(220,182,94,.35)}
.ava{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#7a2a22,#3a110e 75%);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.ava img{width:80%;height:80%}
.nm{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{min-width:92px;text-align:center;padding:5px 10px;border-radius:9px;background:#120506;border:1px solid rgba(255,255,255,.08);font:700 23px/1.15 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.5px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.bar.act .clk{background:linear-gradient(180deg,#f6dc92,#cc9f40);color:#2a1206;border-color:#fff1c2}
.clk.low{color:#ff6b5e;animation:blink 1s steps(2) infinite}
.bar.act .clk.low{background:linear-gradient(180deg,#ff8a7c,#d3392b);color:#fff}
@keyframes blink{50%{opacity:.6}}
.status{margin:6px 0 8px;text-align:center;font-weight:700;font-size:15px;min-height:22px}

/* BOARD */
.frame{width:calc(var(--bs) + 2*var(--fp));padding:var(--fp);border-radius:16px;position:relative;
 background:
  radial-gradient(circle at 9px 9px,#f3d789 0 2.4px,#8a6420 3.2px,transparent 3.6px) top left/100% 100% no-repeat,
  radial-gradient(circle at calc(100% - 9px) 9px,#f3d789 0 2.4px,#8a6420 3.2px,transparent 3.6px) top left/100% 100% no-repeat,
  radial-gradient(circle at 9px calc(100% - 9px),#f3d789 0 2.4px,#8a6420 3.2px,transparent 3.6px) top left/100% 100% no-repeat,
  radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#f3d789 0 2.4px,#8a6420 3.2px,transparent 3.6px) top left/100% 100% no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,rgba(255,150,110,.05) 1px 5px,transparent 5px 9px),
  linear-gradient(135deg,#6b2118,#3d100b 50%,#59190f);
 box-shadow:0 0 0 1px #000,0 0 0 3px var(--gold2),0 0 0 4px #000,0 18px 40px rgba(0,0,0,.6),0 0 70px rgba(220,182,94,.16),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 14px rgba(0,0,0,.5)}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:2px;outline:2px solid var(--gold);box-shadow:0 0 0 3px #000,0 4px 14px rgba(0,0,0,.5)}
.sq{overflow:hidden;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*0.78);line-height:1;cursor:pointer}
.sq.l{background-color:#f7f2e8;background-image:repeating-linear-gradient(92deg,rgba(130,100,70,.07) 0 1px,rgba(255,255,255,.35) 1px 4px,rgba(120,90,60,.05) 4px 6px,transparent 6px 9px),linear-gradient(135deg,rgba(255,255,255,.55),rgba(0,0,0,.05))}
.sq.d{background-color:#962d20;background-image:repeating-linear-gradient(92deg,rgba(40,5,0,.30) 0 1px,rgba(255,160,120,.07) 1px 4px,rgba(40,5,0,.17) 4px 6px,transparent 6px 9px),linear-gradient(135deg,rgba(255,180,140,.16),rgba(0,0,0,.2))}
.co{position:absolute;font-size:calc(var(--bs)/8*0.17);font-weight:700;pointer-events:none;line-height:1}.co.r{top:3px;left:3px}.co.f{bottom:2px;right:3px}
.sq.l .co{color:#962d20}.sq.d .co{color:#f7e3cc}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,214,64,.38)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(70,160,255,.5)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,30,30,.55)}
.sq.tg::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;z-index:3}
.sq.l.tg::after{background:rgba(120,30,20,.38)}.sq.d.tg::after{background:rgba(255,236,210,.6)}
.sq.tgc::after{content:"";position:absolute;inset:4%;border-radius:50%;border:calc(var(--bs)/8*0.08) solid;z-index:3}
.sq.l.tgc::after{border-color:rgba(120,30,20,.4)}.sq.d.tgc::after{border-color:rgba(255,236,210,.65)}
.pc{display:flex;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none;position:relative;z-index:2}
.pcs{width:86%;height:86%;object-fit:contain;display:block;transition:transform .12s ease;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.5))}
.pcs.bl{filter:drop-shadow(0 0 1px rgba(255,255,255,.7)) drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.two .pcs.bl{rotate:180deg}
.two #barT{transform:rotate(180deg)}
.sq:hover .pcs{transform:scale(1.04)}
.sq.sel .pcs{transform:scale(1.08)}
@keyframes drop{from{transform:scale(1.18);opacity:.6}to{transform:scale(1);opacity:1}}
.sq.last .pcs{animation:drop .18s ease-out}
.badge{position:absolute;top:2px;right:2px;min-width:calc(var(--bs)/8*0.42);height:calc(var(--bs)/8*0.42);padding:0 3px;border-radius:999px;color:#fff;font-weight:800;font-size:calc(var(--bs)/8*0.26);display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.6)}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:10px 12px;margin-top:10px}
.fb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:999px;color:#fff;font-weight:800;font-size:13px;flex:none}
.mut{color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#4a1a16,#2a0e0d);font-size:15px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.btn.gold{background:linear-gradient(180deg,#f6dc92,#cc9f40);color:#2a1206;border-color:#fff1c2}
.moves{display:grid;grid-template-columns:28px 1fr 1fr;gap:4px 8px;font-size:14px;height:170px;overflow-y:auto;align-content:start;overflow-anchor:none}
#fb{min-height:84px}
.mv{display:flex;align-items:center;gap:5px}
.mv .sym{min-width:22px;height:18px;font-size:11px;padding:0 4px}
.lg{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
h2{font-size:15px;margin:0 0 6px;color:var(--gold)}

/* MODALS */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,3,3,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.mcard{width:100%;max-width:380px;background:linear-gradient(180deg,#43150f,#250b0a);border:1px solid var(--gold2);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(220,182,94,.18);text-align:center}
.mcard h3{margin:0 0 12px;font-size:22px}
.mcard p{margin:0 0 6px;font-size:16px}
.langs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.lang{padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lang.on{background:linear-gradient(180deg,#f6dc92,#cc9f40);color:#2a1206;border-color:#fff1c2}
.rt{font-size:30px;font-weight:800;margin-bottom:8px}
@media (max-width:420px){.brand{font-size:34px}.gtitle{font-size:16px;gap:6px}.gtitle img{display:none}.pill{font-size:11px;padding:3px 7px}}
</style>
</head>
<body>
<div id="home" class="screen home">
  <div class="hbar"><button class="ib" id="hSet" aria-label="settings">⚙️</button></div>
  <div class="logo"><img id="hLogo" alt=""></div>
  <h1 class="brand gold-t">Nurman chess</h1>
  <p class="tag" data-i="tagline"></p>
  <div class="seg" id="modeSeg"></div>
  <div class="panel">
    <div class="ph" data-i="pickTime"></div>
    <div id="cats"></div>
  </div>
  <div class="sel" id="selTxt"></div>
  <button class="play" id="playBtn"><span data-i="play"></span> ▶</button>
  <p class="note" id="modeNote"></p>
  <p class="note" data-i="clockNote"></p>
</div>

<div id="game" class="screen hidden">
  <div class="stage">
    <div class="top">
      <button class="ib" id="gMenu" aria-label="menu">←</button>
      <div class="gtitle gold-t"><img id="gLogo" alt=""><span>Nurman chess</span><span class="pill" id="gTc"></span></div>
      <button class="ib" id="gSet" aria-label="settings">⚙️</button>
    </div>
    <div class="bar" id="barT"><span class="ava"><img id="avT" alt=""></span><span class="nm" id="nmT"></span><span class="clk" id="clkT"></span></div>
    <div class="frame"><div id="board"></div></div>
    <div class="bar" id="barB"><span class="ava"><img id="avB" alt=""></span><span class="nm" id="nmB"></span><span class="clk" id="clkB"></span></div>
    <p class="status" id="status"></p>
    <div class="card" id="fb"></div>
    <div class="btns"><button class="btn" id="undo"></button><button class="btn" id="resign"></button></div>
    <div class="card"><h2 data-i="movesH"></h2><div class="moves" id="moves"></div></div>
    <div class="card"><h2 data-i="legendH"></h2><div class="lg" id="legend"></div></div>
  </div>
</div>

<div class="modal" id="res"><div class="mcard">
  <div class="rt gold-t" id="rTitle"></div><p id="rText"></p>
  <div class="btns"><button class="btn gold" id="rRe" data-i="rematch"></button><button class="btn" id="rMenu" data-i="menu"></button></div>
</div></div>

<div class="modal" id="set"><div class="mcard">
  <h3 class="gold-t" data-i="settings"></h3>
  <div class="ph" data-i="language" style="text-align:left"></div>
  <div class="langs" id="langs"></div>
  <button class="btn gold" id="setClose" style="width:100%" data-i="close"></button>
</div></div>

function init(){
  const rows=['rnbqkbnr','pppppppp','','','','','PPPPPPPP','RNBQKBNR'];
  const b=[];
  rows.forEach(r=>{for(let c=0;c<8;c++)b.push(r[c]||'');});
  return {b,turn:'w',c:{K:true,Q:true,k:true,q:true},ep:-1};
}

function leastAtt(b,sq,color){
  const r=sq>>3,c=sq&7;let best=Infinity;const W=color==='w';
  const pr=W?r+1:r-1;
  if(pr>=0&&pr<8){for(const dc of[-1,1]){const cc=c+dc;if(cc>=0&&cc<8&&b[pr*8+cc]===(W?'P':'p'))best=Math.min(best,100);}}
  for(const[dr,dc]of KN){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;if(b[rr*8+cc]===(W?'N':'n'))best=Math.min(best,320);}
  for(const[dr,dc]of KG){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;if(b[rr*8+cc]===(W?'K':'k'))best=Math.min(best,20000);}
  for(const[dr,dc]of DG){let rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=b[rr*8+cc];if(p){const l=p.toLowerCase();if(colOf(p)===color&&(l==='b'||l==='q'))best=Math.min(best,AV[l]);break;}rr+=dr;cc+=dc;}}
  for(const[dr,dc]of OR){let rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=b[rr*8+cc];if(p){const l=p.toLowerCase();if(colOf(p)===color&&(l==='r'||l==='q'))best=Math.min(best,AV[l]);break;}rr+=dr;cc+=dc;}}
  return best;
}

function gen(s,caps){
  const b=s.b,t=s.turn,w=t==='w',res=[],opp=w?'b':'w';
  const add=(f,to,o)=>{const m={f,t:to,cap:'',pr:false,ep:false,ca:false,pc:b[f].toLowerCase()};if(o)Object.assign(m,o);res.push(m);};
  for(let i=0;i<64;i++){
    const p=b[i];if(!p||colOf(p)!==t)continue;
    const l=p.toLowerCase(),r=i>>3,c=i&7;
    if(l==='p'){
      const dir=w?-1:1,st=w?6:1,la=w?0:7,r1=r+dir;
      if(r1<0||r1>7)continue;
      if(!b[r1*8+c]){
        if(r1===la)add(i,r1*8+c,{pr:true});
        else if(!caps){add(i,r1*8+c);if(r===st&&!b[(r+2*dir)*8+c])add(i,(r+2*dir)*8+c);}
      }
      for(const dc of[-1,1]){
        const cc=c+dc;if(cc<0||cc>7)continue;
        const to=r1*8+cc,tg=b[to];
        if(tg&&colOf(tg)!==t)add(i,to,{cap:tg.toLowerCase(),pr:r1===la});
        else if(to===s.ep)add(i,to,{cap:'p',ep:true});
      }
    }else if(l==='n'||l==='k'){
      for(const[dr,dc]of(l==='n'?KN:KG)){
        const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;
        const to=rr*8+cc,tg=b[to];
        if(!tg){if(!caps)add(i,to);}
        else if(colOf(tg)!==t)add(i,to,{cap:tg.toLowerCase()});
      }
      if(l==='k'&&!caps){
        if(w&&i===60){
          if(s.c.K&&!b[61]&&!b[62]&&b[63]==='R'&&leastAtt(b,60,opp)===Infinity&&leastAtt(b,61,opp)===Infinity&&leastAtt(b,62,opp)===Infinity)add(60,62,{ca:true});
          if(s.c.Q&&!b[59]&&!b[58]&&!b[57]&&b[56]==='R'&&leastAtt(b,60,opp)===Infinity&&leastAtt(b,59,opp)===Infinity&&leastAtt(b,58,opp)===Infinity)add(60,58,{ca:true});
        }
        if(!w&&i===4){
          if(s.c.k&&!b[5]&&!b[6]&&b[7]==='r'&&leastAtt(b,4,opp)===Infinity&&leastAtt(b,5,opp)===Infinity&&leastAtt(b,6,opp)===Infinity)add(4,6,{ca:true});
          if(s.c.q&&!b[3]&&!b[2]&&!b[1]&&b[0]==='r'&&leastAtt(b,4,opp)===Infinity&&leastAtt(b,3,opp)===Infinity&&leastAtt(b,2,opp)===Infinity)add(4,2,{ca:true});
        }
      }
    }else{
      const dirs=l==='b'?DG:(l==='r'?OR:DG.concat(OR));
      for(const[dr,dc]of dirs){
        let rr=r+dr,cc=c+dc;
        while(rr>=0&&rr<8&&cc>=0&&cc<8){
          const to=rr*8+cc,tg=b[to];
          if(!tg){if(!caps)add(i,to);}
          else{if(colOf(tg)!==t)add(i,to,{cap:tg.toLowerCase()});break;}
          rr+=dr;cc+=dc;
        }
      }
    }
  }
  return res;
}

function make(s,m){
  const b=s.b.slice(),p=b[m.f],w=s.turn==='w';
  b[m.f]='';
  if(m.ep)b[w?m.t+8:m.t-8]='';
  b[m.t]=m.pr?(w?'Q':'q'):p;
  if(m.ca){
    if(m.t===62){b[63]='';b[61]='R';}
    else if(m.t===58){b[56]='';b[59]='R';}
    else if(m.t===6){b[7]='';b[5]='r';}
    else if(m.t===2){b[0]='';b[3]='r';}
  }
  const c={...s.c};
  if(p==='K'){c.K=false;c.Q=false;}
  if(p==='k'){c.k=false;c.q=false;}
  if(m.f===63||m.t===63)c.K=false;
  if(m.f===56||m.t===56)c.Q=false;
  if(m.f===7||m.t===7)c.k=false;
  if(m.f===0||m.t===0)c.q=false;
  let ep=-1;
  if((p==='P'||p==='p')&&Math.abs(m.t-m.f)===16)ep=(m.f+m.t)/2;
  return {b,turn:w?'b':'w',c,ep};
}

const ksq=(b,t)=>b.indexOf(t==='w'?'K':'k');
function inChk(s){return leastAtt(s.b,ksq(s.b,s.turn),s.turn==='w'?'b':'w')!==Infinity;}
function legal(s,caps){
  const opp=s.turn==='w'?'b':'w';
  return gen(s,caps).filter(m=>{const ns=make(s,m);return leastAtt(ns.b,ksq(ns.b,s.turn),opp)===Infinity;});
}
function order(ms){
  const k=m=>(m.cap?10*V[m.cap]-V[m.pc]/10:0)+(m.pr?800:0);
  ms.sort((a,b)=>k(b)-k(a));
}

function ev(s){
  const b=s.b;let sc=0,np=0;
  for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const l=p.toLowerCase();if(l!=='p'&&l!=='k')np+=V[l];}
  for(let i=0;i<64;i++){
    const p=b[i];if(!p)continue;
    const l=p.toLowerCase(),w=p<'a',r=i>>3,c=i&7;
    const cd=Math.min(r,7-r)+Math.min(c,7-c);
    const adv=w?7-r:r;
    let v=V[l];
    if(l==='p')v+=adv*8+((c===3||c===4)?adv*4:0)+(adv>=5?25:0);
    else if(l==='n')v+=cd*12-(adv===0?20:0);
    else if(l==='b')v+=cd*6-(adv===0?20:0);
    else if(l==='r')v+=adv===6?20:0;
    else if(l==='q')v+=cd*3;
    else v+=np>2400?(-adv*20+((adv===0&&(c>=6||c<=2))?30:0)):cd*12;
    sc+=w?v:-v;
  }
  return s.turn==='w'?sc:-sc;
}

function qs(s,a,be,qd){
  const st=ev(s);
  if(qd>=4||st>=be)return st;
  if(st>a)a=st;
  const ms=legal(s,true);order(ms);
  for(const m of ms){
    const sc=-qs(make(s,m),-be,-a,qd+1);
    if(sc>=be)return sc;
    if(sc>a)a=sc;
  }
  return a;
}
function nega(s,d,a,be,ply){
  if(d<=0)return qs(s,a,be,0);
  const ms=legal(s);
  if(!ms.length)return inChk(s)?-(100000-ply):0;
  order(ms);
  let best=-Infinity;
  for(const m of ms){
    const sc=-nega(make(s,m),d-1,-be,-a,ply+1);
    if(sc>best)best=sc;
    if(best>a)a=best;
    if(a>=be)break;
  }
  return best;
}
function analyze(s){
  const ms=legal(s);order(ms);
  return ms.map(m=>({m,sc:-nega(make(s,m),2,-1e9,1e9,1)}));
}

function classify(s,es,played){
  const e=es.find(x=>x.m.f===played.f&&x.m.t===played.t);
  if(!e)return null;
  if(es.length===1)return 'star';
  const best=Math.max(...es.map(x=>x.sc));
  const cl=x=>Math.max(-1500,Math.min(1500,x));
  const cb=cl(best),cp=cl(e.sc),loss=cb-cp;
  const m=e.m,ns=make(s,m);
  const chk=inChk(ns);
  // sacrifice detection
  const v=V[m.pc]||0,g=m.cap?V[m.cap]:0;
  let sac=false,net=0;
  if(m.pc!=='k'&&!m.pr&&v>=300){
    const att=leastAtt(ns.b,m.t,ns.turn);
    let lose=0;
    if(att!==Infinity){
      const def=leastAtt(ns.b,m.t,s.turn);
      lose=def===Infinity?v:Math.max(0,v-att);
    }
    net=g-lose;sac=net<=-200;
  }
  if(loss<=15&&sac&&cb>-200&&cb<500&&cp>-200)return 'bril';
  if(loss<=10)return 'star';
  if(loss<=35)return 'good';
  if(loss<=70)return (sac||chk||m.cap)?'int':'dub';
  if(loss<=150)return 'dub';
  if(loss<=300)return 'mis';
  return 'blu';
}

function san(s,m,ms){
  const p=s.b[m.f],l=p.toLowerCase();
  const sq=i=>FILES[i&7]+(8-(i>>3));
  let str;
  if(m.ca)str=m.t>m.f?'O-O':'O-O-O';
  else if(l==='p'){
    str=m.cap?FILES[m.f&7]+'x'+sq(m.t):sq(m.t);
    if(m.pr)str+='=Q';
  }else{
    str=l.toUpperCase();
    const oth=ms.filter(o=>o!==m&&s.b[o.f]===p&&o.t===m.t);
    if(oth.length){
      const sf=oth.some(o=>(o.f&7)===(m.f&7)),sr=oth.some(o=>(o.f>>3)===(m.f>>3));
      if(!sf)str+=FILES[m.f&7];else if(!sr)str+=(8-(m.f>>3));else str+=sq(m.f);
    }
    if(m.cap)str+='x';
    str+=sq(m.t);
  }
  const ns=make(s,m);
  if(inChk(ns))str+=legal(ns).length?'+':'#';
  return str;
}

  return m+':'+(s<10?'0':'')+s;
}

function drawLegend(){
  const order=['bril','book','good','star','int','dub','mis','blu'];
  $('legend').innerHTML=order.map(k=>{const L=LB[k];return '<span class="sym" style="background:'+L.c+'">'+L.s+'</span><span><b>'+lbn(k)+'</b><br><span class="mut">'+lbd(k)+'</span></span>';}).join('');
}

/* ---------- Input ---------- */
$('board').addEventListener('click',ev=>{
  const el=ev.target.closest('[data-i]');if(!el)return;
  onSquare(+el.dataset.i);
});
function onSquare(i){
  if(busy||over||(mode==='cpu'&&cur.turn!=='w'))return;
  const mv=targets.find(m=>m.t===i);
  if(sel>=0&&mv){doMove(mv);return;}
  if(sel>=0&&!mv){const cm=targets.find(m=>m.ca&&((i===63&&m.t===62)||(i===56&&m.t===58)||(i===7&&m.t===6)||(i===0&&m.t===2)));if(cm){doMove(cm);return;}}
  const p=cur.b[i];
  if(p&&colOf(p)===cur.turn){sel=i;targets=legal(cur).filter(m=>m.f===i);}
  else{sel=-1;targets=[];}
  render();
}

function doMove(m){
  const g=gid;
  tick();
  if(over){busy=false;render();return;}
  busy=true;
  const prev=cur,ms=legal(prev);
  const entry={prev,m,san:san(prev,m,ms),lab:null,clk:{...clk}};
  cur=make(prev,m);hist.push(entry);sel=-1;targets=[];
  if(gtc)clk[prev.turn]+=gtc.inc*1000;
  lastTick=Date.now();
  checkEnd();msgK=over?null:'analyzing';
  render();
  setTimeout(()=>{
    if(g!==gid)return;
    entry.lab=bookNext(hist.indexOf(entry)).has(strip(entry.san))?'book':classify(prev,analyze(prev),m);
    msgK=null;render();
    if(over||mode==='two'){busy=false;return;}
    aiTurn();
  },40);
}

function aiDelay(){
  if(!gtc)return 1200+Math.random()*900;
  if(gtc.m<=1)return 120+Math.random()*250;
  if(gtc.m<=3)return 350+Math.random()*450;
  if(gtc.m<=5)return 700+Math.random()*600;
  return 1200+Math.random()*900;
}
function aiTurn(){
  const g=gid;
  setTimeout(()=>{
    if(g!==gid)return;
    const t0=Date.now();
    const prev=cur,es=analyze(prev);
    if(!es.length){busy=false;return;}
    const best=Math.max(...es.map(e=>e.sc));
    const bk=bookNext(hist.length),msL=legal(prev);
    let pool=best>=90000?es.filter(e=>e.sc===best):es.filter(e=>e.sc>=best-45);
    const bp=es.filter(e=>bk.has(strip(san(prev,e.m,msL)))&&e.sc>=best-80);
    if(bp.length&&best<90000)pool=bp;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    const ms=legal(prev);
    const entry={prev,m:pick.m,san:san(prev,pick.m,ms),lab:bk.has(strip(san(prev,pick.m,ms)))?'book':classify(prev,es,pick.m)};
    const wait=Math.max(0,aiDelay()-(Date.now()-t0));
    setTimeout(()=>{
      if(g!==gid)return;
      tick();
      if(over){busy=false;render();return;}
      entry.clk={...clk};
      cur=make(prev,pick.m);hist.push(entry);
      if(gtc)clk.b+=gtc.inc*1000;
      lastTick=Date.now();
      checkEnd();busy=false;render();
    },wait);
  },40);
}

/* ---------- Flow ---------- */
function showScreen(s){
  screen=s;
  $('home').classList.toggle('hidden',s!=='home');
  $('game').classList.toggle('hidden',s!=='game');
  window.scrollTo(0,0);
}
function startGame(){
  gid++;
  cur=init();hist=[];sel=-1;targets=[];busy=false;over=null;msgK=null;resDismiss=false;
  gtc=selTc.m?{m:selTc.m,inc:selTc.inc}:null;
  clk=gtc?{w:gtc.m*60000,b:gtc.m*60000}:{w:0,b:0};
  lastTick=Date.now();
  $('gTc').textContent=(mode==='two'?'👥 ':'')+tcName(selTc);
  $('game').classList.toggle('two',mode==='two');setNames();
  showScreen('game');render();
}
function setNames(){
  $('nmT').textContent=mode==='two'?t('nB'):t('cpu');
  $('nmB').textContent=mode==='two'?t('nW'):t('you');
}
function toMenu(ask){
  if(ask&&hist.length&&!over&&!confirm(t('leaveQ')))return;
  gid++;busy=false;
  $('res').classList.remove('show');
  showScreen('home');
}
$('playBtn').onclick=startGame;
$('gMenu').onclick=()=>toMenu(true);
$('rMenu').onclick=()=>toMenu(false);
$('rRe').onclick=startGame;
$('res').addEventListener('click',e=>{if(e.target===$('res')){resDismiss=true;render();}});
$('resign').onclick=()=>{
  if(over||!hist.length)return;
  if(!confirm(t('resignQ')))return;
  gid++;busy=false;setOver(mode==='two'?(cur.turn==='w'?'p2w':'p1w'):'resign');render();
};
$('undo').onclick=()=>{
  if(busy||!hist.length)return;
  gid++;
  let n=0,first=null;
  while(hist.length&&(n<1||(mode==='cpu'&&cur.turn!=='w'))){const e=hist.pop();cur=e.prev;first=e;n++;}
  if(gtc&&first&&first.clk)clk={...first.clk};
  lastTick=Date.now();
  over=null;sel=-1;targets=[];msgK=null;render();
};

/* ---------- Home / settings ---------- */
function buildMode(){
  $('modeSeg').innerHTML=[['cpu','🤖'],['two','👥']].map(m=>'<button class="segb'+(mode===m[0]?' on':'')+'" data-mode="'+m[0]+'">'+m[1]+' '+t('mode_'+m[0])+'</button>').join('');
  $('modeNote').textContent=mode==='two'?t('modeTwoNote'):'';
}
$('modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;store.set('nc_mode',mode);buildMode();});
function buildHome(){
  buildMode();
  $('cats').innerHTML=TC.map(c=>'<div class="cat"><span class="ci">'+c.icon+'</span><span class="cn">'+t('cat_'+c.id)+'</span><div class="chips">'+
    c.list.map(x=>'<button class="chip'+(x[0]===selTc.m&&x[1]===selTc.inc?' on':'')+'" data-m="'+x[0]+'" data-inc="'+x[1]+'">'+(x[0]?x[0]+' + '+x[1]:'∞')+'</button>').join('')+'</div></div>').join('');
  $('selTxt').innerHTML=tcName(selTc).replace(/^(.*)$/,'<b>$1</b>');
}
$('cats').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  selTc={m:+b.dataset.m,inc:+b.dataset.inc};
  store.set('nc_tc',selTc.m+','+selTc.inc);
  buildHome();
});
function buildLangs(){
  $('langs').innerHTML=LANGS.map(l=>'<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'"><span>'+l[1]+'</span><span>'+(l[0]===lang?'✓':'')+'</span></button>').join('');
}
$('langs').addEventListener('click',e=>{
  const b=e.target.closest('[data-l]');if(!b)return;
  lang=b.dataset.l;store.set('nc_lang',lang);applyLang();
});
const openSet=()=>{buildLangs();$('set').classList.add('show');};
$('hSet').onclick=openSet;$('gSet').onclick=openSet;
$('setClose').onclick=()=>$('set').classList.remove('show');
$('set').addEventListener('click',e=>{if(e.target===$('set'))$('set').classList.remove('show');});

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{if(!el.classList.contains('sq'))el.textContent=t(el.dataset.i);});
  $('playBtn').innerHTML='<span>'+t('play')+'</span> ▶';
  $('undo').textContent=t('undo');$('resign').textContent=t('resign');
  setNames();
  if(gtc)$('gTc').textContent=(mode==='two'?'👥 ':'')+tcName(selTc);
  buildHome();buildLangs();drawLegend();render();
}
['hLogo','gLogo','avT'].forEach(id=>{$(id).src=IMG[id==='avT'?'bn':'wn'];});
$('avB').src=IMG.wn;
applyLang();
</script>
